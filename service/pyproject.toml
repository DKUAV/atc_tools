[project]
name = "atc-service"
dynamic = ["version"]
description = "Intranet job service for atc_tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
atc-service = "atc_service.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { root = "..", local_scheme = "no-local-version" }
