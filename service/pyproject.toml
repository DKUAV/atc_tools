[project]
name = "atc-service"
version = "0.1.0"
description = "Intranet job service for atc_tools"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[project.scripts]
atc-service = "atc_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
