name: atc-tools
services:
  app:
    image: ${ATC_APP_IMAGE:?Set the tested application image}
    init: true
    restart: unless-stopped
    mem_limit: ${ATC_MEMORY_BYTES:-8589934592}
    cpus: ${ATC_CPUS:-4}
    runtime: ${ATC_RUNTIME:-runc}
    environment:
      SSH_MODE: key-only
      ASCEND_VISIBLE_DEVICES: ${ATC_910B2_DEVICE:-}
      ATC_910B2_DEVICE: ${ATC_910B2_DEVICE:-}
      ATC_AMCT_TARGETS: ${ATC_AMCT_TARGETS:-}
      ATC_SIMULATE_COMPILE: ${ATC_SIMULATE_COMPILE:-0}
      ATC_BROWSER_SECURE_COOKIES: ${ATC_BROWSER_SECURE_COOKIES:-1}
      ATC_BROWSER_SESSION_SECONDS: ${ATC_BROWSER_SESSION_SECONDS:-43200}
      ATC_TIMEOUT_SECONDS: ${ATC_TIMEOUT_SECONDS:-900}
      ATC_CPU_SLOTS: ${ATC_CPU_SLOTS:-2}
      ATC_COMPILE_SLOTS: ${ATC_COMPILE_SLOTS:-1}
      ATC_MAX_UPLOAD_BYTES: ${ATC_MAX_UPLOAD_BYTES:-536870912}
      ATC_MAX_LOG_BYTES: ${ATC_MAX_LOG_BYTES:-4194304}
      ATC_MAX_OUTPUT_BYTES: ${ATC_MAX_OUTPUT_BYTES:-1073741824}
      ATC_MAX_ACCOUNT_BYTES: ${ATC_MAX_ACCOUNT_BYTES:-4294967296}
      ATC_MAX_PENDING_JOBS: ${ATC_MAX_PENDING_JOBS:-8}
      ATC_SCRATCH_BYTES: ${ATC_SCRATCH_BYTES:-4294967296}
    volumes:
      - ${ATC_HOST_DATA_DIR:-/srv/atc-tools}:/data
      - ${SSH_CONFIG_DIR:?Mount the root-owned SSH public key directory}:/root/.ssh:ro
    ports:
      - "${ATC_API_BIND:-127.0.0.1}:${ATC_API_PORT:-8766}:8080"
      - "${ATC_SSH_BIND:-127.0.0.1}:${ATC_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD", "/opt/onnx/bin/python", "-I", "-c", "from urllib.request import ProxyHandler, build_opener; build_opener(ProxyHandler({})).open('http://127.0.0.1:8080/readyz', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
