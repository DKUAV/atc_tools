name: ARM64 service CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      wheel_run:
        description: Successful candidate run for this exact tagged commit (release only)
        type: string
        required: false

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-application.yml
    with:
      publish: false
  candidate-or-release:
    if: github.event_name != 'pull_request' && (github.ref_type != 'tag' || inputs.wheel_run != '')
    concurrency: publish-${{ github.ref }}
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/test-application.yml
    with:
      publish: true
      wheel_run: ${{ inputs.wheel_run || '' }}
