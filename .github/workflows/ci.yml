name: ARM64 service CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  DOCKER_DEFAULT_PLATFORM: linux/arm64

jobs:
  verify:
    name: Tests and simulated service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.31'
          python-version: '3.12'
      - name: Run static checks and unit tests
        run: |
          uv sync --locked
          uv sync --locked --project service
          service_packages=$(uv run --locked --project service python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          uv run --locked ruff check src service/src service/tests tests
          uv run --locked ty check --extra-search-path "$service_packages" src service/src service/tests tests
          uv run --locked pytest -q tests
          node --check service/src/atc_service/web/workbench.js
      - name: Run Compose simulation tests
        run: bash scripts/ci/service-smoke.sh simulate
      - name: Save the tested service image
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: docker image save --output "$RUNNER_TEMP/atc-service.tar" atc-service:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: tested-arm64-service-image
          path: ${{ runner.temp }}/atc-service.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tested service image
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-arm64-service-image
          path: ${{ runner.temp }}
      - name: Push the version to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker image load --input "$RUNNER_TEMP/atc-service.tar"
          [[ $(docker image inspect --format '{{.Os}}/{{.Architecture}}' atc-service:local) == linux/arm64 ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atc-tools-service:$GITHUB_REF_NAME"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker image tag atc-service:local "$image"
          docker image push "$image"
          printf 'Published `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
