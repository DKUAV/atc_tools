name: MobileNetV2 Ascend compilation
on:
  workflow_dispatch:
    inputs:
      image:
        description: Tested ARM64 application image including the release tag or digest
        required: true
        type: string
      checks:
        description: Checks to run
        required: true
        type: choice
        options: [all, compile, offline]
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ATC_APP_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: '3.12'
          version: '0.11.31'
      - name: Load application image
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker pull "$ATC_APP_IMAGE"
      - name: Compile through the API
        if: inputs.checks != 'offline'
        run: bash scripts/ci/compile-mobilenet.sh
      - name: Cold-start the offline bundle
        if: inputs.checks != 'compile'
        run: |
          bash deploy/pack-offline.sh "$RUNNER_TEMP/bundle" "$ATC_APP_IMAGE"
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c SHA256SUMS
          docker image rm "$ATC_APP_IMAGE"
          docker image load -i images.tar
          cd "$GITHUB_WORKSPACE"
          ATC_COMPOSE_FILE="$RUNNER_TEMP/bundle/compose.yaml" bash scripts/ci/service-smoke.sh simulate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.checks != 'offline'
        with:
          name: mobilenet-compilation-logs
          path: ${{ runner.temp }}/mobilenet-logs
