[project]
name = "ascend-atc-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
prepare = ["onnx>=1.16", "onnxruntime>=1.16"]
yolo = ["opencv-python-headless>=4.8"]

[dependency-groups]
dev = ["ascend-atc-tools[prepare,yolo]", "ty>=0.0.1"]

[tool.uv]
package = false

[tool.ty.environment]
extra-paths = ["python"]
