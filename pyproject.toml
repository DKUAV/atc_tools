[project]
name = "ascend-atc-tools"
dynamic = ["version"]
description = "Offline model preparation and inference tools for Ascend CANN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
prepare = ["onnx>=1.16", "onnxruntime>=1.16", "protobuf"]
yolo = ["opencv-python-headless>=4.8"]

[project.scripts]
atc-prepare-model = "ascend_atc_tools.prepare_model:main"
atc-run-om = "ascend_atc_tools.run_om:main"
atc-run-om-ais-bench = "ascend_atc_tools.run_om_ais_bench:main"
atc-compare-outputs = "ascend_atc_tools.compare_outputs:main"
atc-yolo-image = "ascend_atc_tools.yolo_image:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ascend_atc_tools"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { local_scheme = "no-local-version" }

[dependency-groups]
dev = [
    "ascend-atc-tools[prepare,yolo]",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
extra-paths = ["src"]
