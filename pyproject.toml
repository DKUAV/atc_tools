[project]
name = "ascend-atc-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
prepare = ["onnx>=1.16", "onnxruntime>=1.16"]
yolo = ["opencv-python-headless>=4.8"]

[dependency-groups]
dev = [
    "ascend-atc-tools[prepare,yolo]",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
src = ["python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
extra-paths = ["python"]
