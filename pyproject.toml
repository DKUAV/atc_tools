[project]
name = "atc_tools"
dynamic = ["version"]
description = "Offline model preparation and inference tools for Ascend CANN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnx>=1.16",
    "onnxruntime>=1.16",
    "opencv-contrib-python>=4.8",
    "protobuf",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
atc_tools = "atc_tools.cli:main"
atc_service = "atc_service.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atc_tools", "src/atc_service"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/_shell.sh" = "atc_tools/scripts/_shell.sh"
"scripts/compile.sh" = "atc_tools/scripts/compile.sh"
"scripts/quantize_model.sh" = "atc_tools/scripts/quantize_model.sh"
"scripts/run_model.sh" = "atc_tools/scripts/run_model.sh"
"configs" = "atc_tools/configs"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { local_scheme = "no-local-version" }

[dependency-groups]
dev = [
    "atc_tools[service]",
    "pytest>=9",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
extra-paths = ["src"]
python-platform = "linux"
